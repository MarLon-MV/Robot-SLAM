[develop]
script_dir=$base/lib/mtrb_bringup
[install]
install_scripts=$base/lib/mtrb_bringup

[flake8]
max-line-length = 99
import-order-style = google
# Same ignores as ament_flake8 (ROS 2 default style).
extend-ignore = B902,C816,D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,D404,I202,Q000
exclude = build,install,log

[tool:pytest]
junit_family = xunit2
markers =
    linter: style/lint checks
    flake8: flake8 check
    pep257: docstring check
